      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

e": "", "code_hash": "05097213253981fd0be84931e312ce0d", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "ecfG", "name": "_"}, {"code": "", "code_hash": "8a87276b38b0d90a8ce27b9a4b07bda9", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "Pvdt", "name": "_"}, {"code": "", "code_hash": "488faba3a227817231c9abf2250940ce", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "ZBYS", "name": "_"}, {"code": "", "code_hash": "18e8010e17a692d5af8e73b7db491fcd", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "aLJB", "name": "_"}, {"code": "", "code_hash": "f17424ceaae84a33962186997bab58e9", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "nHfw", "name": "_"}, {"code": "", "code_hash": "0f92cb16c736cc63030dd5e52ffd79ae", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "xXTn", "name": "_"}, {"code": "", "code_hash": "f2589c5c461d497df79d3d09d82f655b", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "AjVT", "name": "_"}], "metadata": {"marimo_version": "0.25.1"}, "version": "1"},
            "session": {"cells": [{"code_hash": "43baf416d76b50a1781d4d352c211b7d", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5c933b91d50636aa40ff988eecaf86d4", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "253ea5ab9e78e33ccc1bad0cc5dc79f6", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6e584955dc9fba1198ff5fe4eb2d17c5", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eLightweight version.\u0026#92;u003c/strong\u0026#92;u003e Figures are fixed at their default settings so the page loads fast. For live controls, open the \u0026#92;u003ca href=\u0026#92;\u0026quot;../\u0026#92;\u0026quot;\u0026#92;u003einteractive version\u0026#92;u003c/a\u0026#92;u003e.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "5bc95a2e641df7dc4851d9a654162e63", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2c3f3f3d2d8fd55903ed658ae997dea8", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a6ab95859522c1b54285678cdda1e790", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\n\u003Cstyle\u003E\n  .fig { width: 100%; max-width: 860px; margin: .8rem auto 1.2rem; }\n  .fig \u003E svg { width: 100%; height: auto; display: block; }\n  .markdown img, img { max-width: 100%; height: auto; }\n  .markdown table { display: block; max-width: 100%; overflow-x: auto; }\n  @media (max-width: 700px) {\n    .markdown { font-size: 1.03rem; line-height: 1.58; }\n    .markdown h1 { font-size: 1.7rem; line-height: 1.2; }\n    .markdown h2 { font-size: 1.35rem; }\n    .markdown h3 { font-size: 1.12rem; }\n    .markdown p, .markdown li { overflow-wrap: break-word; }\n  }\n\u003C/style\u003E\n"}, "type": "data"}]}, {"code_hash": "14460f062902139f02c11c0dee803631", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"designing-an-sirna-against-ttr\"\u003EDesigning an siRNA against TTR\u003C/h1\u003E\n\u003Ch3 id=\"a-worked-case-study-with-two-approved-drugs-as-the-answer-key\"\u003EA worked case study, with two approved drugs as the answer key\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EClinical motivation.\u003C/strong\u003E Transthyretin is a liver-made protein\nthat ferries thyroxine and retinol through the blood. Destabilising\npoint mutations disrupt protein folding which leads to progressive\nsensorimotor and autonomic \u003Cstrong\u003Epolyneuropathy\u003C/strong\u003E, a restrictive\n\u003Cstrong\u003Ecardiomyopathy\u003C/strong\u003E, or both. If left untreated, the disease is fatal.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhy an siRNA is a suitable drug modality here\u003C/strong\u003E \u2014 three things\nline up:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe protein is the problem.\u003C/strong\u003E This is a gain-of-toxic-function\n  disease: nothing is missing, something harmful is accumulating. So\n  lowering the protein \u003Cem\u003Eis\u003C/em\u003E the therapy, which is precisely what RNAi\n  does. \u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOne tissue makes it.\u003C/strong\u003E Essentially all circulating TTR comes from\n  hepatocytes \u2014 and hepatocytes are the one cell type oligonucleotide\n  delivery has genuinely solved, via GalNAc conjugation.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe target is dispensable.\u003C/strong\u003E Deep, sustained knockdown is well\n  tolerated: thyroxine transport is redundant, and retinol transport\n  is covered by vitamin A supplementation.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ETransthyretin is an unusually good gene to learn siRNA design on. It is\nshort, it is almost entirely liver-expressed, and it already\nhas \u003Cstrong\u003Etwo\u003C/strong\u003E approved siRNA drugs against it, developed a decade apart:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003Cth\u003E\u003Cstrong\u003Epatisiran\u003C/strong\u003E (2018)\u003C/th\u003E\n\u003Cth\u003E\u003Cstrong\u003Evutrisiran\u003C/strong\u003E (2022)\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eduplex\u003C/td\u003E\n\u003Ctd\u003E19+2 / 19+2, dTdT overhangs\u003C/td\u003E\n\u003Ctd\u003E23 / 21\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Echemistry\u003C/td\u003E\n\u003Ctd\u003Ea few 2\u2032-OMe, nothing else\u003C/td\u003E\n\u003Ctd\u003Efully modified, 2\u2032-OMe + 2\u2032-F\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ebackbone\u003C/td\u003E\n\u003Ctd\u003Eall phosphodiester\u003C/td\u003E\n\u003Ctd\u003Eterminal phosphorothioate\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Edelivery\u003C/td\u003E\n\u003Ctd\u003Elipid nanoparticle, IV\u003C/td\u003E\n\u003Ctd\u003EGalNAc conjugate, subcutaneous\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Edosing\u003C/td\u003E\n\u003Ctd\u003Eevery 3 weeks, with premedication\u003C/td\u003E\n\u003Ctd\u003Eonce every 3 months\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003ESame gene, same mechanism, same company \u2014 and almost nothing in common\nchemically. That gap is the whole story of the last decade of the field.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHow to read this.\u003C/strong\u003E Each section asks one design question, shows the\nfigure that answers it, and checks the answer against where patisiran\nand vutrisiran actually landed. The controls below are shown at their default settings; the interactive version recomputes as you move them.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENothing here is a simulation: both sequences and both modification\npatterns are the published ones, scored by the same pipeline as every\nother candidate. All \u003Cstrong\u003E597 candidates\u003C/strong\u003E across\nTTR NM_000371.4 (616 nt) are in the\npage.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b5bc34d873bc5ed8d5b2ca3ad82e4311", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-walk-the-transcript\"\u003E1. Walk the transcript\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEvery design starts by tiling the transcript into every guide it can\naccommodate \u2014 \u003Cstrong\u003E597 candidates across\n616 nucleotides\u003C/strong\u003E, four exons, a 26 nt 5\u2032UTR and a long\n3\u2032UTR that turns out to matter. That is the honest denominator: both\napproved drugs are somewhere in this set, and so is every\nnonfunctional sequence.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe first filter anyone reaches for is \u003Cstrong\u003EGC content\u003C/strong\u003E. Too low and the\nduplex is unstable and promiscuous; too high and it is hard to unwind\nand prone to off-target hybridisation. The conventional window is\n15\u201356 %.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDrag the window and watch where the rejects fall.\u003C/strong\u003E They are not\nevenly spread, and the two bounds bite in opposite places: tightening\nfrom above cuts the GC-rich coding sequence, while raising the floor\neats into the AT-rich 3\u2032UTR \u2014 the very region both drugs bind. At the\nconventional setting only the upper bound fires at all.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e6b12f85a55753c7e7d5a0eea86e4e92", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RGSE-0' random-id='bf1a3ad1-6a65-f3f5-7928-68e555e7d91c'\u003E\u003Cmarimo-range-slider data-initial-value='[15,56]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eGC window (%)\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='0' data-stop='100' data-step='1' data-steps='[]' data-debounce='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-full-width='true' data-disabled='false'\u003E\u003C/marimo-range-slider\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "40f26ae49db29e8b188bac2e5f0d510d", "console": [], "id": "Kclp", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Kclp-0' random-id='94505229-e09e-caa3-1fc3-faf674b075b7'\u003E\u003Cmarimo-plotly data-initial-value='{}' data-label='null' data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;hovertemplate\u0026quot;:\u0026quot;position %{x}\u0026#92;u003cbr\u0026#92;u003eGC %{y:.0f}%\u0026#92;u003cextra\u0026#92;u003e\u0026#92;u003c/extra\u0026#92;u003e\u0026quot;,\u0026quot;marker\u0026quot;:{\u0026quot;color\u0026quot;:\u0026quot;#9aa3ad\u0026quot;,\u0026quot;line\u0026quot;:{\u0026quot;width\u0026quot;:0},\u0026quot;opacity\u0026quot;:0.45,\u0026quot;size\u0026quot;:3.0},\u0026quot;mode\u0026quot;:\u0026quot; se dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAt \u003Cstrong\u003E15\u201356 %\u003C/strong\u003E, \u003Cstrong\u003E182 of 597 candidates\u003C/strong\u003E fall outside the window \u2014 all of them GC-rich \u2014 leaving \u003Cstrong\u003E415\u003C/strong\u003E (\u003Cstrong\u003E69.5 %\u003C/strong\u003E). Both approved drugs are still inside it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA composition flag, not a gate: nothing downstream is removed on this\nbasis. GC content and predicted activity are independent.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0812016f852cc7a5b2adc9edd70acdba", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-choose-your-candidates\"\u003E2. Choose your candidates\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EComposition describes a sequence; it does not predict whether it will\nwork. Every candidate is scored on three independent axes:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPredicted efficacy\u003C/strong\u003E \u2014 a random forest trained on fully modified\n  siRNA knockdown data. \u003Cem\u003EPlotted on x.\u003C/em\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThermodynamic asymmetry (\u0394\u0394G)\u003C/strong\u003E \u2014 are the duplex ends lopsided\n  enough that RISC loads the guide rather than the passenger strand?\n  \u003Cem\u003EPlotted on y.\u003C/em\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETarget accessibility\u003C/strong\u003E \u2014 is the site unpaired and reachable in the\n  folded transcript? \u003Cem\u003ECarried by colour.\u003C/em\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EHigher is better on all three: \u003Cstrong\u003Eupper, right and bright.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cs ross-species conservation is a \u003Cstrong\u003Edesign constraint, not a\ndownstream surprise\u003C/strong\u003E \u2014 and it is cheapest to apply here, before a\nlead is chosen.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPick the species your programme intends to dose.\u003C/strong\u003E The candidate set\nis filtered to guides that are cross-reactive in all of them, and the\nstrip shows where on the transcript the survivors sit.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f6987480296971381ebc1a8f79b34ab3", "console": [], "id": "qnkX", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='qnkX-0' random-id='03860882-e03f-c0ed-cffe-6cd038a1a66c'\u003E\u003Cmarimo-multiselect data-initial-value='[\u0026quot;cynomolgus_monkey\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eRequire cross-reactivity in\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;cynomolgus_monkey\u0026quot;,\u0026quot;rhesus_monkey\u0026quot;,\u0026quot;minipig\u0026quot;,\u0026quot;rabbit\u0026quot;,\u0026quot;dog\u0026quot;,\u0026quot;sheep\u0026quot;,\u0026quot;mouse\u0026quot;,\u0026quot;rat\u0026quot;]' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-multiselect\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='qnkX-1' random-id='f3536077-d6b8-96e0-c033-c7aadb3ff32e'\u003E\u003Cmarimo-switch data-initial-value='false' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:pros rkdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ERequiring cynomolgus monkey leaves \u003Cstrong\u003E346 of 597\u003C/strong\u003E candidates (\u003Cstrong\u003E58.0 %\u003C/strong\u003E). Both approved drugs survive it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECynomolgus is the pharmacologically relevant species here, and the most\npermissive in the set \u2014 both programmes ran their NHP work there.\n\u003Cstrong\u003EAdd a rodent and watch the set collapse.\u003C/strong\u003E No wild-type mouse or rat\ncan read out on-target biology for these sequences, which is why that\nwork needs a \u003Cstrong\u003Esurrogate sequence\u003C/strong\u003E matched to the rodent transcript or\na \u003Cstrong\u003Ehuman-transgenic\u003C/strong\u003E model \u2014 and both have to be planned at sequence\nselection, not discovered later.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "520a04520e35c2be9c95c102ed5d1113", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-chemistry-is-everything\"\u003E4. Chemistry is everything\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EAn unmodified siRNA has a plasma half-life measured in minutes.\nEverything that makes one a drug \u2014 nuclease resistance, reduced immune\nsensing, tissue targeting, monthly dosing \u2014 is chemistry layered onto a\nsequence that was already chosen.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEach circle is one nucleotide coloured by its sugar chemistry; ticks\nmark phosphorothioate linkages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "405d44f6ae9ae30cc1c47b89dbb0d9ce", "console": [], "id": "ulZA", "outputs": [{"data": {"text/html": "\u003Cdiv class=\"fig\"\u003E\u003Csvg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"5600\" height=\"2240\" viewBox=\"0 0 5600 "cursor-pointer\" transform=\"translate(1013,226)\"\u003E\u003Crect class=\"bg\" x=\"0.5\" y=\"0.5\" width=\"40\" height=\"23\" style=\"stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;\"/\u003E\u003Ctext class=\"annotation-text\" text-anchor=\"middle\" x=\"20.53125\" y=\"19\" style=\"font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 16.6543px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;\"\u003EOMe\u003C/text\u003E\u003C/g\u003E\u003C/g\u003E\u003C/g\u003E\u003Cg class=\"annotation\" data-index=\"59\" style=\"opacity: 1;\"\u003E\u003Cg class=\"annotation-text-g\" transform=\"rotate(0,1095.64,238.41)\"\u003E\u003Cg class=\"cursor-pointer\" transform=\"translate(1089,226)\"\u003E\u003Crect class=\"bg\" x=\"0.5\" y=\"0.5\" width=\"13\" height=\"23\" style=\"stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;\"/\u003E\u003Ctext class=\"annotation-text\" text-anchor=\"middle\" x=\"6.7890625\" y=\"19\" style=\"font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 16.6543px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;\"\u003EF\u003C/text\u003E\u003C/g\u003E\u003C/g\u003E\u003C/g\u003E\u003Cg class=\"annotation\" data-index=\"60\" style=\"opacity: 1;\"\u003E\u003Cg class=\"annotation-text-g\" transform=\"rotate(0,1150.47,238.41)\"\u003E\u003Cg class=\"cursor-pointer\" transform=\"translate(1138,226)\"\u003E\u003Crect class=\"bg\" x=\"0.5\" y=\"0.5\" width=\"24\" height=\"23\" style=\"stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;\"/\u003E\u003Ctext class=\"annotation-text\" text-anchor=\"middle\" x=\"12.71875\" y=\"19\" style=\"font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 16.6543px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;\"\u003EPS\u003C/text\u003E\u003C/g\u003E\u003C/g\u003E\u003C/g\u003E\u003Cg class=\"annotation\" data-index=\"61\" style=\"opacity: 1;\"\u003E\u003Cg class=\"annotation-text-g\" transform=\"rotate(0,720.71,39.53)\"\u003E\u003Cg class=\"cursor-pointer\" transform=\"translate(655,24)\"\u003E\u003Crect class=\"bg\" x=\"0.5\" y=\"0.5\" width=\"130\" height=\"31\" style=\"stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;\"/\u003E\u003Ctext class=\"annotation-text\" text-anchor=\"middle\" x=\"65.3125\" y=\"25\" style=\"font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 23.1524px; fill: rgb(17, 24, 39); fill-opacity: 1; white-space: pre;\"\u003E\u003Ctspan style=\"font-weight:bold\"\u003Evutrisiran\u003C/tspan\u003E\u003C/text\u003E\u003C/g\u003E\u003C/g\u003E\u003C/g\u003E\u003C/g\u003E\u003C/svg\u003E\u003C/svg\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "05097213253981fd0be84931e312ce0d", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPatisiran is almost entirely unmodified.\u003C/strong\u003E Two 2\u2032-OMe residues on the\nguide and nine on the sense strand \u2014 11 of 38 positions \u2014 plus dTdT\noverhangs, an all-phosphodiester backbone, no 2\u2032-F and no conjugate.\nEverything else is bare ribose, and the guide in particular is\nessentially unmodified. To compensate, it is delivered intravenously\nin a\nlipid nanoparticle: get as much to the liver as possible before it\ndegrades.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EVutrisiran is modified at every single position\u003C/strong\u003E \u2014 all 44, 2\u2032-OMe or\n2\u2032-F, with phosphorothioate at both guide termini and the sense 5\u2032 end.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBut the GalNAc conjugate is the game changer. It binds the\nasialoglycoprotein receptor, which is hepatocyte-specific and recycles\nevery 15 minutes \u2014 so the drug delivers itself to the liver from a\nsubcutaneous injection and stays active for months.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESame target. Same binding site, nine nucleotides apart. A decade of\nchemistry in between.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8a87276b38b0d90a8ce27b9a4b07bda9", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-how-do-the-other-approved-drugs-stack-up\"\u003E5. How do the other approved drugs stack up?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe same pipeline, run on every approved siRNA against its own target\ntranscript, with no knowledge that any of them is a drug. A sanity\ncheck: molecules that survived clinical development ought to rank well\namong the thousands of candidates they were selected from.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThere is a real weakness in that check, and it is worth naming.\nConsensus Rank's third axis is \u003Cstrong\u003E\u0394\u0394G on an unmodified duplex\u003C/strong\u003E, but every\nmolecule here is fully chemically modified \u2014 it scores them as though\ntheir chemistry did not exist. So each gene was also re-scored under\nits drug's own registered pattern, which swaps that axis for\nmodification-aware \u003Cstrong\u003E\u0394\u0394T\u003Csub\u003Em\u003C/sub\u003E\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EGrey = scored unmodified. Green = scored under its own chemistry.\u003C/strong\u003E\nSwitch the view to see either ranking on its own, or both side by\nside with the move printed at the end of each pair. The dotted line\nis the 50th percentile \u2014 below it, a drug ranks worse than half the\nsequences it was selected from.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "488faba3a227817231c9abf2250940ce", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/ht long the transcript.\u003C/strong\u003E The candidates a\n   GC window rejects cluster in the coding sequence, not the 3\u2032UTR\n   where both drugs ended up.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERanking is three independent axes\u003C/strong\u003E, not one number. They don't\n   correlate, and the disagreement is where the design decision lives.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EConservation is a property of the nucleotides you picked\u003C/strong\u003E, not of\n   the gene \u2014 it decides which question each species in your tox plan\n   can actually answer.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EBoth approved TTR drugs bind the 3\u2032UTR\u003C/strong\u003E, nine nucleotides apart,\n   found independently a decade apart. A pattern, not a rule.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EChemistry is where the decade went.\u003C/strong\u003E Same target, same site, same\n   mechanism: unmodified-and-infused versus fully-modified,\n   GalNAc-conjugated, dosed quarterly.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f2589c5c461d497df79d3d09d82f655b", "console": [], "id": "AjVT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EThat's it! Ready to design your own siRNAs? Head to the \u003Ca href=\"https://sirna-toolkit.streamlit.app\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EsiRNA Toolkit\u003C/a\u003E to get started.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EThis demo was built with a snapshot from the siRNA Toolkit pipeline. Run: demo/demo_ttr_df.parquet, frozen 2026-10-07.\u003C/em\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EDesigned and written by Eric Kercher, PhD and Claude, with help and support from the folks at the RNA Therapeutics Institute @ UMass Chan.\u003C/em\u003E \u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
